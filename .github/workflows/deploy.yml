name: Validate and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never allow two production deploys to race. A newer commit waits for the
# current release instead of cancelling a deployment halfway through.
concurrency:
  group: velocity-venue-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Validate and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_LIVEKIT_URL: ${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out the release
        uses: actions/checkout@v6

      - name: Use the supported Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The test command also creates the exact production build that Wrangler
      # deploys in the following step.
      - name: Build and test
        run: npm test

      - name: Deploy the verified build
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.92.0"
          command: deploy
