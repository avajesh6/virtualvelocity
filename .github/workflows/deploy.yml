name: Validate

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep validation runs ordered so results always describe a complete commit.
# Cloudflare's native Git integration is the sole production publisher.
concurrency:
  group: velocity-venue-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_LIVEKIT_URL: ${{ vars.NEXT_PUBLIC_LIVEKIT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out the release
        uses: actions/checkout@v6

      - name: Use the supported Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.1"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The test command also verifies that the production Worker build can be
      # created from the locked dependency graph.
      - name: Build and test
        run: npm test
