[project]
name = "velocity-transcription-agent"
version = "0.1.0"
description = "Multi-user LiveKit captions and finalized transcript ingestion for Velocity Venue"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.12,<4",
  "livekit-agents>=1.3,<2",
  "python-dotenv>=1.1,<2",
]

[tool.ruff]
line-length = 100
target-version = "py310"
